<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Алгоритмы</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Алгоритмы — практика</h1>
  <p>Базовые операции, ввод и вывод данных, работа со списком.</p>

  <hr>

  <h2>1. Калькулятор</h2>

  <label for="leftNumber">Аргумент А:</label>
  <input id="leftNumber" type="number" placeholder="5">

  <label for="rightNumber">Аргумент Б:</label>
  <input id="rightNumber" type="number" placeholder="6">

  <br><br>

  <button type="button" data-calc="sum">Сложить +</button>
  <button type="button" data-calc="difference">Вычесть −</button>

  <p>
    <output id="mathOutput">Готов к работе</output>
  </p>

  <hr>

  <h2>2. Список имён</h2>

  <label for="personName">Новое имя:</label>
  <input id="personName" type="text" autocomplete="off" placeholder="Например: инноКЕнТиЙ">

  <br><br>

  <button id="insertPerson" type="button">Добавить в список</button>
  <button id="scanPerson" type="button">Проверить символы</button>
  <button id="rollback" type="button">Отменить</button>

  <p>
    Клик — выбрать |
    ↑ ↓ — навигация |
    Ctrl+Z — отмена
  </p>

  <div id="roster" aria-live="polite"></div>

  <dialog id="symbolDialog">
    <form method="dialog">
      <h3>Лишние символы</h3>
      <p>В строке есть цифры или посторонние знаки. Очистить их?</p>

      <button id="removeGarbage" value="clean">Очистить</button>
      <button value="keep">Оставить</button>
    </form>
  </dialog>

  <div id="notice" hidden></div>

  <script src="script.js"></script>

</body>
</html>
